<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tintinnabulum — sandbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304141c'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%2339b7a8'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2339b7a8' stroke-opacity='.5' stroke-width='1.5'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f5f7; --surface: #fff; --fg: #1d1d1f; --muted: #6e6e73;
    --line: #e3e3e6; --line-strong: #d0d0d5; --accent: #0071e3;
    --warn: #c1341b; --ok: #1d7a3e;
    --r-card: 14px; --r-ctl: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased;
  }
  h1 { margin: 0; font-weight: 600; font-size: 1.0625rem; letter-spacing: -0.01em; }

  header {
    display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap;
    padding: .8rem 1.25rem; background: rgba(255,255,255,.72);
    backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
  }
  h1 a { color: inherit; text-decoration: none; }
  h1 a:hover { color: var(--accent); }
  header .sub { color: var(--muted); font-size: .8125rem; }
  header .spacer { flex: 1 1 auto; }
  header a.src { color: var(--accent); text-decoration: none; font-size: .8125rem; }
  #stat { color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }

  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 56vh; background: #04141c; touch-action: manipulation; }
  #unlock { position: absolute; inset: 0; display: none; place-items: center; text-align: center;
            background: rgba(4,20,28,.72); color: #fff; cursor: pointer; padding: 1rem; }
  #unlock.show { display: grid; }
  #unlock span { font-size: 1.1875rem; font-weight: 500; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .5 } }

  main { max-width: 820px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

  /* ---------- the one action, centred ---------- */
  .hero { display: flex; flex-direction: column; align-items: center; gap: .6rem; margin-bottom: 2rem; }
  #start {
    width: 100%; max-width: 420px; min-height: 52px; padding: .85rem 1.5rem;
    font: 600 1.0625rem/1.2 inherit; color: #fff; background: var(--accent);
    border: none; border-radius: var(--r-ctl); cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  #start:hover { background: #0063c8; }
  #start:active { transform: scale(.99); }
  #start[data-on="true"] { background: var(--warn); }
  #audio-status { color: var(--muted); font-size: .875rem; text-align: center; min-height: 1.3em; }
  #audio-status[data-state="bad"] { color: var(--warn); }
  #audio-status[data-state="good"] { color: var(--ok); }

  /* ---------- collapsible panels ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line);
           border-radius: var(--r-card); margin-bottom: .6rem; overflow: hidden; }
  .panel > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: .75rem;
    padding: .95rem 1.15rem; min-height: 56px;
  }
  .panel > summary::-webkit-details-marker { display: none; }
  .panel > summary::after {
    content: ""; width: 7px; height: 7px; margin-left: auto; flex: none;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
    transform: rotate(-45deg); transition: transform .2s ease;
  }
  .panel[open] > summary::after { transform: rotate(45deg); }
  .panel[open] > summary { border-bottom: 1px solid var(--line); }
  .panel > summary:hover { background: #fafafb; }
  .panel .t { font-weight: 600; font-size: .9375rem; flex: none; }
  .panel .v { color: var(--muted); font-size: .8125rem; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
  .panel .body { padding: 1.15rem; }

  .sub-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em;
               color: var(--muted); font-weight: 600; margin: 1.35rem 0 .1rem; }
  .sub-label:first-child { margin-top: 0; }
  .note { color: var(--muted); font-size: .8125rem; margin: .7rem 0 0; min-height: 1.2em; }

  details.more { margin-top: 1.15rem; border-top: 1px solid var(--line); padding-top: .3rem; }
  details.more > summary { list-style: none; cursor: pointer; color: var(--accent);
    font-size: .875rem; padding: .5rem 0; display: flex; align-items: center; gap: .4rem;
    user-select: none; min-height: 40px; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before {
    content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor; transform: rotate(-45deg);
    transition: transform .18s ease; }
  details.more[open] > summary::before { transform: rotate(45deg); }
  .more-body { padding: .3rem 0 .2rem; display: grid; gap: 1rem;
               grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(134px, 1fr)); gap: .55rem; }
  .card { border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--surface);
    cursor: pointer; padding: .65rem .7rem; text-align: left; font: inherit; color: var(--fg);
    min-height: 52px; transition: border-color .15s ease, transform .1s ease; }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card b { display: block; font-size: .9375rem; font-weight: 600; }
  .card span { display: block; font-size: .75rem; color: var(--muted); margin-top: .1rem; }
  .card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .card[aria-pressed="true"] b { color: var(--accent); }

  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: .55rem; }
  .sw { border: 2px solid transparent; border-radius: var(--r-ctl); padding: 0; background: none;
        cursor: pointer; transition: transform .12s ease, border-color .12s ease; }
  .sw:hover { transform: translateY(-2px); border-color: var(--line-strong); }
  .sw .chip { position: relative; display: flex; align-items: center; justify-content: center; gap: 4px;
              height: 40px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); }
  .sw .chip i { width: 8px; height: 8px; border-radius: 50%; }
  .sw canvas { display: block; width: 100%; height: 40px; border-radius: 7px;
               box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); }
  .sw small { display: block; margin-top: .25rem; font-size: .6875rem; color: var(--muted); text-align: center; }
  .sw[aria-pressed="true"] { border-color: var(--accent); }
  .sw[aria-pressed="true"] small { color: var(--accent); font-weight: 600; }
  .sw[aria-pressed="true"] .chip::after { content: "✓"; position: absolute; right: 5px; bottom: 0;
    font-size: .6875rem; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.9); }

  .langs { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: .45rem; }
  .lang { border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface);
    cursor: pointer; padding: .4rem .2rem; font: inherit; color: var(--fg);
    min-height: 54px; text-align: center; transition: border-color .12s ease, transform .12s ease; }
  .lang:hover { border-color: var(--accent); transform: translateY(-1px); }
  .lang .fl { display: block; width: 24px; height: 18px; margin: 0 auto; border-radius: 2px;
              object-fit: cover; box-shadow: 0 0 0 1px rgba(0,0,0,.14); }
  .lang .nm { display: block; font-size: .6875rem; color: var(--muted); margin-top: .2rem;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lang[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .lang[aria-pressed="true"] .nm { color: var(--accent); font-weight: 600; }

  label.field { display: block; font-size: .8125rem; color: var(--muted); }
  label.field > span { display: block; margin-bottom: .3rem; }
  select, input[type=text], input[type=number] {
    width: 100%; padding: .5rem .6rem; font: inherit; color: var(--fg);
    border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); min-height: 40px; }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .check { display: flex; align-items: center; gap: .55rem; font-size: .875rem; color: var(--fg);
           min-height: 40px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  button.act { font: inherit; padding: .55rem 1rem; border: 1px solid var(--line-strong);
    background: var(--surface); border-radius: 8px; cursor: pointer; min-height: 40px; color: var(--fg); }
  button.act:hover { border-color: var(--accent); color: var(--accent); }
  button.act.rec { color: #fff; background: var(--warn); border-color: var(--warn); }

  #log { padding: 0; list-style: none; font-size: .8125rem; margin: 0;
         max-height: 240px; overflow: hidden; }
  #log li { padding: .3rem 0; border-bottom: 1px solid var(--line); color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  @media (max-width: 640px) {
    canvas { height: 42vh; }
    main { padding: 1.1rem 1rem 3rem; }
    .panel .body { padding: 1rem; }
    header { padding: .7rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1><a id="home" href="https://github.com/Guillain-RDCDE/tintinnabulum">Tintinnabulum</a></h1>
  <span class="sub">listen to a live stream of events</span>
  <span class="spacer"></span>
  <span id="stat"></span>
  <a class="src" id="source-link" href="https://github.com/Guillain-RDCDE/tintinnabulum">Source</a>
</header>

<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="unlock"><span>Tap to enable sound</span></div>
</div>

<main>

  <div class="hero">
    <button id="start" type="button" data-on="false">Start listening</button>
    <span id="audio-status"></span>
  </div>

  <details class="panel" id="sec-listen">
    <summary><span class="t">Listen to</span><span class="v" id="sum-listen"></span></summary>
    <div class="body">
      <div class="cards" id="feeds"></div>
      <p class="note" id="feed-note"></p>

      <div id="langs-wrap" hidden>
        <p class="sub-label">Wikipedia editions</p>
        <div class="langs" id="langs-grid"></div>
      </div>

      <div id="ingest-wrap" hidden>
        <p class="sub-label">Ingest stream</p>
        <label class="field"><span>Stream URL</span>
          <input type="text" id="ingest-url" value="/events" placeholder="http://localhost:8080/events">
        </label>
      </div>

      <details class="more" id="more-listen">
        <summary>Advanced</summary>
        <div class="more-body">
          <label class="field"><span>Editions by code</span>
            <input type="text" id="langs" value="en" placeholder="en,fr,de">
          </label>
          <label class="field"><span>Wikipedia backend</span>
            <select id="backend">
              <option value="eventstreams">EventStreams (Wikimedia)</option>
              <option value="wikimon">wikimon (Hatnote)</option>
            </select>
          </label>
        </div>
      </details>
    </div>
  </details>

  <details class="panel" id="sec-sound">
    <summary><span class="t">Sound</span><span class="v" id="sum-sound"></span></summary>
    <div class="body">
      <div class="cards" id="kits"></div>
      <p class="note" id="kit-note"></p>

      <details class="more" id="more-sound">
        <summary>Advanced</summary>
        <div class="more-body">
          <label class="field"><span>Volume</span>
            <input type="range" id="volume" min="0" max="100" value="70"></label>
          <label class="field"><span>Simultaneous notes</span>
            <input type="number" id="voices" min="1" max="64" value="16"></label>
          <label class="field"><span>Pitch curve</span>
            <select id="mode">
              <option value="adaptive">Adaptive (self-calibrating)</option>
              <option value="log">Logarithmic</option>
              <option value="linear">Linear</option>
            </select></label>
          <label class="field"><span>Musical scale</span><select id="scale"></select></label>
          <label class="field"><span>Key</span><select id="key"></select></label>
          <label class="field"><span>Range in semitones</span>
            <input type="number" id="range" min="6" max="60" value="27"></label>
          <label class="field"><span>Humanise <span id="humanise-val">0</span></span>
            <input type="range" id="humanise" min="0" max="20" value="0"></label>
          <label class="field"><span>Tempo <span id="bpm-val">free</span></span>
            <input type="range" id="bpm" min="0" max="200" step="5" value="0"></label>
          <label class="field"><span>Snap notes to</span>
            <select id="division">
              <option value="4">Quarter notes</option>
              <option value="8" selected>Eighth notes</option>
              <option value="16">Sixteenth notes</option>
            </select></label>
          <div>
            <label class="check"><input type="checkbox" id="invert" checked> Large events sound low</label>
            <button id="record" class="act" type="button" style="margin-top:.4rem">Record</button>
          </div>
        </div>
      </details>
    </div>
  </details>

  <details class="panel" id="sec-look">
    <summary><span class="t">Look</span><span class="v" id="sum-look"></span></summary>
    <div class="body">
      <p class="sub-label">Visualisation</p>
      <div class="cards" id="scenes"></div>
      <p class="note" id="scene-note"></p>

      <p class="sub-label">Colours</p>
      <div class="swatches" id="palettes"></div>
      <p class="note" id="palette-note"></p>

      <p class="sub-label" id="shapes-label">Shapes</p>
      <div class="swatches" id="shapes"></div>
      <p class="note" id="shape-note"></p>

      <details class="more" id="more-look">
        <summary>Advanced</summary>
        <div class="more-body">
          <div>
            <label class="check"><input type="checkbox" id="starfield"> Starry sky</label>
            <label class="check"><input type="checkbox" id="labels" checked> Show titles on new events</label>
            <label class="check"><input type="checkbox" id="hud" checked> Show the rate counter</label>
          </div>
        </div>
      </details>
    </div>
  </details>

  <details class="panel" id="sec-filter">
    <summary><span class="t">Filter</span><span class="v" id="sum-filter"></span></summary>
    <div class="body">
      <p class="note" style="margin-top:0">Anything filtered out is still drawn, dimmed, but stays silent.</p>
      <div class="more-body" style="margin-top:.8rem">
        <label class="field"><span>Categories</span>
          <select id="cats" multiple size="4">
            <option value="user" selected>user</option>
            <option value="anon" selected>anon</option>
            <option value="bot" selected>bot</option>
            <option value="alert" selected>alert</option>
          </select>
        </label>
        <label class="field"><span>Minimum size</span>
          <input type="number" id="minmag" value="0" min="0">
        </label>
      </div>
    </div>
  </details>

  <details class="panel" id="sec-activity">
    <summary><span class="t">Activity</span><span class="v" id="sum-activity"></span></summary>
    <div class="body"><ul id="log"></ul></div>
  </details>

</main>

<script type="module" src="./demo.js"></script>
</body>
</html>
